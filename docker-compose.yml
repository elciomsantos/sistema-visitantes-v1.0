# Deploy em producao: copie este projeto para /opt/sistema-visitantes
# (ex.: /opt/sistema-visitantes/docker-compose.yml) e execute
#   cd /opt/sistema-visitantes && docker compose up -d --build
#
# Acesso externo: container "nginx" (reverse proxy) na porta NGINX_PORT
# (padrao 8000). Config em deploy/nginx/default.conf. O container "app"
# nao publica portas no host; e acessado apenas pela rede interna.
#
# Dados persistentes (banco + fotos) ficam no drive D (RAID 6),
# montado em /srv no servidor. Ajuste via .env se necessario:
#   DB_DATA_DIR - pasta do banco de dados no RAID 6 (default: /srv/sistema-visitantes/mysql)
#   FOTOS_DIR   - pasta de fotos dos visitantes no RAID 6 (default: /srv/sistema-visitantes/fotos)
#   NGINX_PORT  - porta externa do sistema (default: 8000)
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: ${APP_ENV:-production}
    user: "1000:1000"
    # Sem portas publicadas: acesso somente via container nginx (rede frontend)
    expose:
      - "80"
    environment:
      VISITORPASS_DB_HOST: db
      VISITORPASS_DB_PORT: 3306
      VISITORPASS_DB_NAME: ${VISITORPASS_DB_NAME:-visitorpass}
      VISITORPASS_DB_USER: ${VISITORPASS_DB_USER:-vpuser}
      VISITORPASS_DB_PASS: ${VISITORPASS_DB_PASS:-visitorpassword}
      VISITORPASS_SESSION_TIMEOUT: ${VISITORPASS_SESSION_TIMEOUT:-3600}
      VISITORPASS_SESSION_ABSOLUTE_LIFETIME: ${VISITORPASS_SESSION_ABSOLUTE_LIFETIME:-43200}
      VISITORPASS_MFA_KEY: ${VISITORPASS_MFA_KEY:-}
      VISITORPASS_APP_NAME: "Sistema de Visitantes"
      VISITORPASS_ENV: ${APP_ENV:-production}
    volumes:
      # Fotos dos visitantes no drive D (RAID 6).
      # No host: chown 1000:1000 ${FOTOS_DIR:-/srv/sistema-visitantes/fotos}
      - ${FOTOS_DIR:-/srv/sistema-visitantes/fotos}:/var/www/html/fotos_visitantes
      - ./public/imagens:/var/www/html/public/imagens:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    networks:
      - frontend
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256

  nginx:
    image: nginx:stable-alpine
    ports:
      # Unica porta publicada no host (acesso via http://<IP-do-servidor>:8000)
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 128m
    pids_limit: 64

  db:
    image: mysql:26.10
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${VISITORPASS_DB_NAME:-visitorpass}
      MYSQL_USER: ${VISITORPASS_DB_USER:-vpuser}
      MYSQL_PASSWORD: ${VISITORPASS_DB_PASS:-visitorpassword}
    volumes:
      # Dados do MySQL no drive D (RAID 6).
      # No host: chown 999:999 ${DB_DATA_DIR:-/srv/sistema-visitantes/mysql}
      - ${DB_DATA_DIR:-/srv/sistema-visitantes/mysql}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 1g
    pids_limit: 512

# Os dados persistentes (banco e fotos) agora usam bind mounts no RAID 6
# (/srv), montados pelo app e db acima. Nao ha volumes nomeados do Docker.

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true